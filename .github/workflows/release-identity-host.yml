name: Scoped folder reselection confirmation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped:
    name: Verify explicit folder reselection and next-process capture
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the terminal receipt for the sandboxed folder picker
        run: python3 -B Tests/BookmarkLifecycleHost/run.py --product 558b62f54963cb48790597c94f8e4e85eeda7dd6 --output test-results/bookmark-reselection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: bookmark-reselection-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/bookmark-reselection.json
          if-no-files-found: error
          retention-days: 7
