name: Exact stable Riftlet build 67 Sparkle admission
on:
  push:
    branches: [codex/riftlet-110-sparkle-67-to-68-qa]
    paths: ['.github/workflows/release-identity-host.yml', 'Tests/PublicSparkleUpgrade/**']
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [preflight, private-upgrade]
      private_release_id:
        description: Owner-staged draft release ID (private-upgrade only)
        required: false
        type: string
      private_feed_b64:
        description: Existing signed loopback QA XML only (private-upgrade only)
        required: false
        type: string
permissions:
  contents: read
jobs:
  public_preflight:
    if: github.ref == 'refs/heads/codex/riftlet-110-sparkle-67-to-68-qa' && (github.event_name == 'push' || inputs.mode == 'preflight')
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps: &upgrade_steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 2598c0004d1f897880951e6c8a38c7503eb61948
          path: stable67
      - name: Retrieve owner-staged private inputs
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'private-upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_RELEASE_ID: ${{ inputs.private_release_id }}
          PRIVATE_FEED_B64: ${{ inputs.private_feed_b64 }}
        run: python3 -B Tests/PublicSparkleUpgrade/private_feed.py
      - name: Prepare standard XCTest bundle
        working-directory: Tests/PublicSparkleUpgrade
        run: |
          set -eu
          if ! ruby -rxcodeproj -e 'exit 0'; then
            gem install --user-install --no-document xcodeproj --version 1.27.0
          fi
          ruby project.rb
      - name: Exercise the public Developer ID application and its own Sparkle menu
        env:
          UPGRADE_MODE: ${{ inputs.mode || 'preflight' }}
          UPGRADE_DMG_SHA256: 9f654539619b87ead785828e83cde631896089abc055602bed805588544511f1
        run: python3 -B Tests/PublicSparkleUpgrade/exercise.py
      - if: ${{ !cancelled() && hashFiles('test-results/public-sparkle.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build67-sparkle-${{ inputs.mode || 'preflight' }}-${{ github.run_id }}
          retention-days: 14
          path: test-results/public-sparkle.json
          if-no-files-found: error
  owner_draft_update:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'private-upgrade' && github.ref == 'refs/heads/codex/riftlet-110-sparkle-67-to-68-qa' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: macos-15-intel
    timeout-minutes: 20
    # GitHub requires push access even for a GET on a draft release.
    # Pass the token only to the scoped GET step; checkout never persists it.
    permissions:
      contents: write
    steps: *upgrade_steps
