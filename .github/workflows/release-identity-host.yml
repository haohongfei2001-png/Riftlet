name: Isolated macOS 15 timeline measurement
on:
  push:
    branches: [codex/riftlet-110-wheel-macos15-probe]
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile the reviewed tests
        run: swift build --build-tests
      - name: Measure paged scrolling on the same hosted Mac
        shell: bash
        run: |
          set -eu
          mkdir -p measurements
          for mode in sync deferred deferredSlow; do
            result=0
            RIFTLET_SCROLL_PROBE_MODE="$mode" swift test --skip-build --no-parallel --filter PresentationBoundaryTests/testNativeScrollingKeepsCaptureOrderAndPagesPastTwentyWithoutSelecting > "measurements/$mode.log" 2>&1 || result=$?
            echo "$mode exit=$result"
            awk '/TIMELINE/ && (/request|before page|after page|missing|end forward/)' "measurements/$mode.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: timeline-scroll-measurements
          path: measurements
          if-no-files-found: error
          retention-days: 3
