name: Public Riftlet in-app update on an isolated Mac
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [preflight, upgrade]
      candidate_sha256:
        description: SHA-256 of the publicly released candidate DMG (upgrade only)
        required: false
        type: string
permissions:
  contents: read
jobs:
  actual_update:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare standard XCTest bundle
        working-directory: Tests/PublicSparkleUpgrade
        run: |
          set -eu
          if ! ruby -rxcodeproj -e 'exit 0'; then
            gem install --user-install --no-document xcodeproj --version 1.27.0
          fi
          ruby project.rb
      - name: Exercise the public Developer ID application and its own Sparkle menu
        env:
          UPGRADE_MODE: ${{ inputs.mode }}
          UPGRADE_DMG_SHA256: ${{ inputs.candidate_sha256 }}
        run: python3 -B Tests/PublicSparkleUpgrade/exercise.py
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-sparkle-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 14
          path: test-results/public-sparkle.json
          if-no-files-found: error
