name: Scoped folder and consent experiment
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped:
    name: Bookmarks and independent first permission decisions
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run disposable folder and permission protocols
        run: python3 -B Tests/BookmarkLifecycleHost/run.py --product 2fbb0661d1aeb3126fea3537ece6625c16649124 --output test-results/scoped-folder-consent.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: scoped-folder-consent-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/scoped-folder-consent.json
          if-no-files-found: error
          retention-days: 7
