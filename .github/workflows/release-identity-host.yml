name: Public Riftlet in-app update on an isolated Mac
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [private-upgrade]
      candidate_sha256:
        description: SHA-256 of the candidate DMG for the selected upgrade channel
        required: false
        type: string
      private_release_id:
        description: Owner-staged draft release ID (private-upgrade)
        required: false
        type: string
      private_feed_b64:
        description: Signed loopback QA XML only (private-upgrade)
        required: false
        type: string
permissions:
  contents: read
jobs:
  actual_update:
    if: inputs.mode != 'private-upgrade'
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps: &upgrade_steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retrieve owner-staged private inputs
        if: inputs.mode == 'private-upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_RELEASE_ID: ${{ inputs.private_release_id }}
          PRIVATE_FEED_B64: ${{ inputs.private_feed_b64 }}
        run: python3 -B Tests/PublicSparkleUpgrade/private_feed.py
      - name: Prepare standard XCTest bundle
        working-directory: Tests/PublicSparkleUpgrade
        run: |
          set -eu
          if ! ruby -rxcodeproj -e 'exit 0'; then
            gem install --user-install --no-document xcodeproj --version 1.27.0
          fi
          ruby project.rb
      - name: Exercise the public Developer ID application and its own Sparkle menu
        env:
          UPGRADE_MODE: ${{ inputs.mode }}
          UPGRADE_DMG_SHA256: ${{ inputs.candidate_sha256 }}
        run: python3 -B Tests/PublicSparkleUpgrade/exercise.py
      - if: ${{ !cancelled() && hashFiles('test-results/public-sparkle.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-sparkle-${{ inputs.mode }}-${{ github.run_id }}
          retention-days: 14
          path: test-results/public-sparkle.json
          if-no-files-found: error
  owner_draft_update:
    if: inputs.mode == 'private-upgrade' && github.ref == 'refs/heads/codex/riftlet-110-sparkle-65-to-68' && github.actor == github.repository_owner
    runs-on: macos-15-intel
    timeout-minutes: 20
    # GitHub requires push access even for a GET on a draft release.
    # The token is passed only to the scoped GET step; checkout does not persist it.
    permissions:
      contents: write
    steps: *upgrade_steps
