name: Native foundation
on:
  push:
    branches:
      - 'codex/riftlet-real-mac-acceptance-*'
      - 'codex/riftlet-real-mac-round*'
      - 'codex/system-capture-candidate-20261028'
      - 'codex/system-screenshot-real-20261028'
      - 'codex/arrival-none-magnet-native-20261028'
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'Package.swift'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/native-foundation.yml'
      - 'engineering/evidence/2026-10-27-real-mac-round2/network-fault.*'
      - 'engineering/evidence/2026-10-27-real-mac-round3/network-probe.*'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.js'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.cjs'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.js'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.cjs'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'ThirdPartyNotices/**'
      - 'research/web-attachment-handoff-2026-10-27/**'
      - 'Package.swift'
      - 'scripts/**'
      - 'packaging/**'
      - '.github/workflows/native-foundation.yml'
      - 'engineering/evidence/2026-10-27-real-mac-round2/network-fault.*'
      - 'engineering/evidence/2026-10-27-real-mac-round3/network-probe.*'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.js'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.cjs'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.js'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.cjs'
permissions:
  contents: read
concurrency:
  group: native-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source_admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact final source admission and immutable inherited audits
        run: |
          set -o pipefail
          mkdir -p test-results
          python3 -B -m unittest discover -s Tests/FinalProductIsolation -v 2>&1 | tee test-results/final-isolation-tests.log
          python3 -B -m unittest discover -s Tests/UnifiedCandidateIsolation -v 2>&1 | tee test-results/unified-isolation-tests.log
          python3 -B -m unittest discover -s Tests/ThinEdgeIsolation -v 2>&1 | tee test-results/thin-edge-isolation-tests.log
          python3 -B -m unittest discover -s Tests/BuiltInCaptureIsolation -v 2>&1 | tee test-results/builtin-isolation-tests.log
          python3 -B scripts/verify-final-product-composition.py 2>&1 | tee test-results/final-product-composition.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-source-admission-${{ github.sha }}
          path: test-results/
          retention-days: 14
  macos:
    # Native verification is independent, not an exception to admission. The
    # workflow fails if source_admission fails; no unreviewed tree is promoted.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record compiler and OS
        run: |
          swift --version
          sw_vers
          uname -m
      - name: Replay archived Web evidence offline
        run: |
          set -o pipefail
          mkdir -p test-results
          node --version
          python3 research/web-attachment-handoff-2026-10-27/replay.py 2>&1 | tee test-results/web-handoff-replay.log
      - name: Exercise integrated page program with synthetic DOM
        run: |
          set -o pipefail
          node Tests/WebPageProgram/acceptance-program.test.cjs 2>&1 | tee test-results/web-page-program.log
          node Tests/WebPageProgram/legacy-web-observe.test.cjs 2>&1 | tee test-results/legacy-web-observe.log
      - name: Exercise round-two fault harness offline
        run: |
          set -o pipefail
          node engineering/evidence/2026-10-27-real-mac-round2/network-fault.test.cjs 2>&1 | tee test-results/round2-network-fault-fixture.log
      - name: Exercise round-three diagnostic probe offline
        run: |
          set -o pipefail
          node engineering/evidence/2026-10-27-real-mac-round3/network-probe.test.cjs 2>&1 | tee test-results/round3-network-probe-fixture.log
      - name: Verify round-five diagnostic evidence helpers offline
        # Preserved round-five diagnostic scripts run only with synthetic fixtures.
        # They do not install hooks in Chrome or generate real upload evidence.
        run: |
          set -o pipefail
          node engineering/evidence/2026-10-27-real-mac-round5/page-evidence-helper.test.cjs 2>&1 | tee test-results/round5-page-evidence-helper.log
          node engineering/evidence/2026-10-27-real-mac-round5/progress-diagnostic-probe.test.cjs 2>&1 | tee test-results/round5-progress-probe.log
          node engineering/evidence/2026-10-27-real-mac-round5/versioned-progress-diagnostic-probe.test.cjs 2>&1 | tee test-results/round5-versioned-probe.log
      - name: Verify system-screenshot stage-two diagnostic fixtures
        run: node --test engineering/evidence/2026-10-28-system-screenshot-stage2/*.test.cjs
      - name: Establish and verify actual CI accessibility baseline
        # These are ephemeral CI-runner preferences. Product accessibility
        # guards are unchanged; a fresh AppKit process must observe this value.
        run: |
          set -o pipefail
          mkdir -p test-results
          swift -e 'import AppKit; let w = NSWorkspace.shared; print("before.reduceMotion=\(w.accessibilityDisplayShouldReduceMotion) before.increaseContrast=\(w.accessibilityDisplayShouldIncreaseContrast) before.reduceTransparency=\(w.accessibilityDisplayShouldReduceTransparency)")' | tee test-results/accessibility-before.log
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          swift -e 'import AppKit; let w = NSWorkspace.shared; print("reduceMotion=\(w.accessibilityDisplayShouldReduceMotion) increaseContrast=\(w.accessibilityDisplayShouldIncreaseContrast) reduceTransparency=\(w.accessibilityDisplayShouldReduceTransparency)"); guard !w.accessibilityDisplayShouldReduceMotion && !w.accessibilityDisplayShouldReduceTransparency && !w.accessibilityDisplayShouldIncreaseContrast else { fatalError("CI accessibility baseline is not normal; motion/material evidence cannot be captured") }' | tee test-results/accessibility-normal-motion.log
      - name: Compile screenshot comparison probe and report environment capabilities
        run: |
          set -o pipefail
          swiftc -parse-as-library -O -target "$(uname -m)-apple-macosx13.0" scripts/benchmark-builtin-capture.swift -o /tmp/riftlet-capture-benchmark 2>&1 | tee test-results/capture-probe-build.log
          /tmp/riftlet-capture-benchmark --self-check 2>&1 | tee test-results/capture-probe-self-check.log
          /tmp/riftlet-capture-benchmark --iterations 5 --output test-results/capture-backend-probe.json --retain-synthetic-images test-results/synthetic-capture-previews 2>&1 | tee test-results/capture-backend-probe.log
      - name: Execute native unit and integration tests
        run: |
          set -o pipefail
          mkdir -p test-results
          swift test --parallel 2>&1 | tee test-results/swift-test.log
      - name: Verify isolated arrival delta and report native motion outcomes
        if: github.head_ref == 'codex/arrival-none-magnet-native-20261028' || github.ref == 'refs/heads/codex/arrival-none-magnet-native-20261028'
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s Tests/ArrivalIsolation -v 2>&1 | tee test-results/arrival-isolation-tests.log
          python3 -B scripts/verify-arrival-integration.py 2>&1 | tee test-results/arrival-integration.log
          swift test --skip-build --filter 'ArrivalMotionPreferencesTests|CaptureArrivalObservationTests|ArrivalModesTests|MagnetMotionPlanTests|MagnetFlightPresenterTests|ScreenshotSourceGeometryTests' 2>&1 | tee test-results/arrival-native-detailed.log
          swiftc -typecheck scripts/arrival-source-probe.swift 2>&1 | tee test-results/arrival-probe-typecheck.log
      - name: Verify packaging rejection paths offline
        run: |
          set -o pipefail
          python3 -m unittest discover -s Tests/Packaging -v 2>&1 | tee test-results/packaging-tests.log
          python3 -m unittest discover -s Tests/InternalBetaPackaging -v 2>&1 | tee test-results/internal-beta-packaging-tests.log
      - name: Report software panel lifecycle outcomes
        run: |
          set -o pipefail
          # Parallel discovery lines do not distinguish passed from XCTSkip.
          # Reuse the build and report only this existing suite in detail.
          swift test --skip-build --filter RiftLifecycleTests 2>&1 | tee test-results/rift-lifecycle-detailed.log
          swift test --skip-build --filter RiftInputIslandTests 2>&1 | tee test-results/rift-input-islands-detailed.log
          swift test --skip-build --filter DeferredChromeActivityBindingTests 2>&1 | tee test-results/deferred-chrome-binding-detailed.log
          swift test --skip-build --filter RiftSetupControllerTests 2>&1 | tee test-results/setup-window-detailed.log
          swift test --skip-build --filter ReleaseCaptureTests 2>&1 | tee test-results/release-capture-detailed.log
          swift test --skip-build --filter PresentationBoundaryTests 2>&1 | tee test-results/presentation-boundaries-detailed.log
          swift test --skip-build --filter WebAcceptanceIntegrationTests 2>&1 | tee test-results/web-composition-detailed.log
          swift test --skip-build --filter PassivePermissionResumeTests 2>&1 | tee test-results/passive-permission-resume-detailed.log
          swift test --skip-build --filter ChromeActiveTabDescriptorTests 2>&1 | tee test-results/chrome-active-descriptor-detailed.log
          swift test --skip-build --filter AcceptedSelectionQueueTests 2>&1 | tee test-results/accepted-selection-queue-detailed.log
          swift test --skip-build --filter SelectionAuthorityTests 2>&1 | tee test-results/selection-authority-detailed.log
          swift test --skip-build --filter SelectionSubmissionQueueTests 2>&1 | tee test-results/selection-submission-detailed.log
          swift test --skip-build --filter SystemScreenshotWebCandidateTests 2>&1 | tee test-results/system-candidate-input-detailed.log
          swift test --skip-build --filter SystemScreenshotCandidateAdmissionTests 2>&1 | tee test-results/system-candidate-admission-detailed.log
          swift test --skip-build --filter SystemScreenshotObservationJournalTests 2>&1 | tee test-results/system-candidate-observations-detailed.log
          swift test --skip-build --filter SystemScreenshotCandidateIntegrationTests 2>&1 | tee test-results/system-candidate-composition-detailed.log
          swift test --skip-build --filter SystemScreenshotFidelityTests 2>&1 | tee test-results/system-candidate-fidelity-detailed.log
          swift test --skip-build --filter 'RiftletFeedbackTests|RiftletFeedbackUITests' 2>&1 | tee test-results/feedback-detailed.log
          swift test --skip-build --filter 'ScreenshotEntry|InteractiveScreenshot|CompletedScreenshotImporter|RiftCapturePresentation|BuiltInScreenshotHost|ScreenshotMarkupFidelity|RiftSetupController' 2>&1 | tee test-results/capture-entry-detailed.log
          swift test --skip-build --filter 'CaptureSourceBindingTests|CapturePreferenceObservationTests' 2>&1 | tee test-results/capture-source-binding-detailed.log
          swift test --skip-build --filter 'UnifiedSettingsTests|QuietEdgeInteractionTests|QuietEdgeWindowTests|RiftLayoutTests|RiftPeekGeometryTests|FeedbackVisualCandidateTests' 2>&1 | tee test-results/unified-product-detailed.log
      - name: Exercise the production screenshot engine and private import with an owned fixture
        env:
          RIFTLET_REAL_CAPTURE_FIXTURE: '1'
        run: |
          set -o pipefail
          # Serial and opt-in: this does not run inside the parallel software suite.
          # The test also requires GITHUB_ACTIONS and preexisting capture permission.
          # Actual output/import failures fail; an unavailable safe fixture is NOT_RUN.
          swift test --skip-build --filter BuiltInCaptureNativeProbeTests 2>&1 | tee test-results/builtin-capture-native-probe.log
      - name: Verify strict magnet completion and resource cleanup separately
        run: |
          set -o pipefail
          swift test --skip-build --filter MagnetFlightPresenterTests 2>&1 | tee test-results/magnet-strict-completion.log
      - name: Package native application
        run: |
          set -o pipefail
          bash scripts/build-macos.sh 2>&1 | tee test-results/build.log
      - name: Run packaged executable with synthetic data
        run: |
          set -o pipefail
          build/Riftlet.app/Contents/MacOS/Riftlet --self-check 2>&1 | tee test-results/self-check.log
          riftlet_check_dir="$(mktemp -d)"
          trap 'rm -rf "$riftlet_check_dir"' EXIT
          ditto build/Riftlet.app "$riftlet_check_dir/Riftlet.app"
          "$riftlet_check_dir/Riftlet.app/Contents/MacOS/Riftlet" --web-acceptance-self-check 2>&1 | tee test-results/web-acceptance-self-check.log
          "$riftlet_check_dir/Riftlet.app/Contents/MacOS/Riftlet" --first-use-self-check 2>&1 | tee test-results/first-use-self-check.log
          "$riftlet_check_dir/Riftlet.app/Contents/MacOS/Riftlet" --system-screenshot-candidate-self-check 2>&1 | tee test-results/system-screenshot-candidate-self-check.log
          ditto -c -k --sequesterRsrc --keepParent build/Riftlet.app build/Riftlet-macOS-development.zip
      - name: Package unified internal Beta with explicit candidate entry
        env:
          RIFTLET_BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          bash scripts/package-internal-beta.sh 2>&1 | tee test-results/internal-beta-package.log
      - name: Validate and archive synthetic GUI acceptance helper
        run: |
          set -o pipefail
          riftlet_bin_dir="$(swift build -c release --show-bin-path)"
          "$riftlet_bin_dir/RiftletGUIAcceptance" --self-check 2>&1 | tee test-results/gui-helper-self-check.log
          cp "$riftlet_bin_dir/RiftletGUIAcceptance" build/RiftletGUIAcceptance
          ditto -c -k --keepParent build/RiftletGUIAcceptance build/Riftlet-GUI-Acceptance.zip
      - name: Capture isolated native visual evidence at original pixels
        env:
          RIFTLET_BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s Tests/NativeVisualEvidence -v 2>&1 | tee test-results/native-visual-manifest-tests.log
          riftlet_bin_dir="$(swift build -c release --show-bin-path)"
          python3 -B scripts/capture-native-visual-evidence.py --helper "$riftlet_bin_dir/RiftletGUIAcceptance" --expected-system-accessibility normal --output "$PWD/test-results/native-visual" 2>&1 | tee test-results/native-visual-capture.log
      - name: Capture additional integrated experience windows at original pixels
        env:
          RIFTLET_BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          python3 -B scripts/capture-supplemental-native-visual-evidence.py --self-check 2>&1 | tee test-results/native-visual-supplemental-self-check.log
          riftlet_bin_dir="$(swift build -c release --show-bin-path)"
          python3 -B scripts/capture-supplemental-native-visual-evidence.py --helper "$riftlet_bin_dir/RiftletGUIAcceptance" --expected-system-accessibility normal --output "$PWD/test-results/native-visual-supplemental" 2>&1 | tee test-results/native-visual-supplemental.log
      - name: Capture Quiet Edge R2 native geometry
        env:
          RIFTLET_BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          riftlet_bin_dir="$(swift build -c release --show-bin-path)"
          python3 -B scripts/capture-quiet-edge-r2-evidence.py --helper "$riftlet_bin_dir/RiftletGUIAcceptance" --output "$PWD/test-results/quiet-edge-r2"
      - name: Capture bounded actual system accessibility variants
        env:
          RIFTLET_BUILD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          # Only this disposable CI runner is changed. Fresh product/helper
          # processes continue to read and honor the real AppKit system policy.
          defaults write com.apple.universalaccess reduceMotion -bool true
          defaults write com.apple.universalaccess reduceTransparency -bool true
          defaults write com.apple.universalaccess increaseContrast -bool true
          riftlet_bin_dir="$(swift build -c release --show-bin-path)"
          "$riftlet_bin_dir/RiftletGUIAcceptance" --report-system-accessibility | tee test-results/accessibility-reduced.log
          python3 -B scripts/capture-native-visual-evidence.py --helper "$riftlet_bin_dir/RiftletGUIAcceptance" --expected-system-accessibility reduced --only-case queue-dark --only-case entry-dark --only-case motion-magnet --output "$PWD/test-results/native-visual-accessibility" 2>&1 | tee test-results/native-visual-accessibility-capture.log
      - name: Reject actual screenshot output failures independently of software tests
        if: always()
        run: |
          set -o pipefail
          python3 -B scripts/verify-capture-probe-outcome.py test-results/capture-backend-probe.json 2>&1 | tee test-results/capture-output-contract.log
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-foundation-${{ matrix.runner }}-${{ github.sha }}
          path: |
            test-results/
            build/Riftlet-macOS-development.zip
            build/Riftlet-Internal-Beta.zip
            build/Riftlet-GUI-Acceptance.zip
          if-no-files-found: ignore
          retention-days: 14
