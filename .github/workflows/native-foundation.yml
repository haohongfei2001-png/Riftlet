name: Native foundation
on:
  push:
    branches:
      - 'codex/riftlet-real-mac-acceptance-*'
      - 'codex/riftlet-real-mac-round*'
      - 'codex/system-capture-candidate-20261028'
      - 'codex/system-screenshot-real-20261028'
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'Package.swift'
      - 'scripts/**'
      - '.github/workflows/native-foundation.yml'
      - 'engineering/evidence/2026-10-27-real-mac-round2/network-fault.*'
      - 'engineering/evidence/2026-10-27-real-mac-round3/network-probe.*'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.js'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.cjs'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.js'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.cjs'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'ThirdPartyNotices/**'
      - 'research/web-attachment-handoff-2026-10-27/**'
      - 'Package.swift'
      - 'scripts/**'
      - '.github/workflows/native-foundation.yml'
      - 'engineering/evidence/2026-10-27-real-mac-round2/network-fault.*'
      - 'engineering/evidence/2026-10-27-real-mac-round3/network-probe.*'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.js'
      - 'engineering/evidence/2026-10-27-real-mac-round5/*.cjs'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.js'
      - 'engineering/evidence/2026-10-28-system-screenshot-stage2/*.cjs'
permissions:
  contents: read
concurrency:
  group: native-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record compiler and OS
        run: |
          swift --version
          sw_vers
          uname -m
      - name: Replay archived Web evidence offline
        run: |
          set -o pipefail
          mkdir -p test-results
          node --version
          python3 research/web-attachment-handoff-2026-10-27/replay.py 2>&1 | tee test-results/web-handoff-replay.log
      - name: Exercise integrated page program with synthetic DOM
        run: |
          set -o pipefail
          node Tests/WebPageProgram/acceptance-program.test.cjs 2>&1 | tee test-results/web-page-program.log
          node Tests/WebPageProgram/legacy-web-observe.test.cjs 2>&1 | tee test-results/legacy-web-observe.log
      - name: Exercise round-two fault harness offline
        run: |
          set -o pipefail
          node engineering/evidence/2026-10-27-real-mac-round2/network-fault.test.cjs 2>&1 | tee test-results/round2-network-fault-fixture.log
      - name: Exercise round-three diagnostic probe offline
        run: |
          set -o pipefail
          node engineering/evidence/2026-10-27-real-mac-round3/network-probe.test.cjs 2>&1 | tee test-results/round3-network-probe-fixture.log
      - name: Verify round-five diagnostic evidence helpers offline
        # Preserved round-five diagnostic scripts run only with synthetic fixtures.
        # They do not install hooks in Chrome or generate real upload evidence.
        run: |
          set -o pipefail
          node engineering/evidence/2026-10-27-real-mac-round5/page-evidence-helper.test.cjs 2>&1 | tee test-results/round5-page-evidence-helper.log
          node engineering/evidence/2026-10-27-real-mac-round5/progress-diagnostic-probe.test.cjs 2>&1 | tee test-results/round5-progress-probe.log
          node engineering/evidence/2026-10-27-real-mac-round5/versioned-progress-diagnostic-probe.test.cjs 2>&1 | tee test-results/round5-versioned-probe.log
      - name: Verify system-screenshot stage-two diagnostic fixtures
        run: node --test engineering/evidence/2026-10-28-system-screenshot-stage2/*.test.cjs
      - name: Native unit and integration tests
        run: |
          set -o pipefail
          mkdir -p test-results
          swift test --parallel 2>&1 | tee test-results/swift-test.log
      - name: Verify packaging rejection paths offline
        run: |
          set -o pipefail
          python3 -m unittest discover -s Tests/Packaging -v 2>&1 | tee test-results/packaging-tests.log
      - name: Report software panel lifecycle outcomes
        run: |
          set -o pipefail
          # Parallel discovery lines do not distinguish passed from XCTSkip.
          # Reuse the build and report only this existing suite in detail.
          swift test --skip-build --filter RiftLifecycleTests 2>&1 | tee test-results/rift-lifecycle-detailed.log
          swift test --skip-build --filter RiftInputIslandTests 2>&1 | tee test-results/rift-input-islands-detailed.log
          swift test --skip-build --filter DeferredChromeActivityBindingTests 2>&1 | tee test-results/deferred-chrome-binding-detailed.log
          swift test --skip-build --filter RiftSetupControllerTests 2>&1 | tee test-results/setup-window-detailed.log
          swift test --skip-build --filter ReleaseCaptureTests 2>&1 | tee test-results/release-capture-detailed.log
          swift test --skip-build --filter PresentationBoundaryTests 2>&1 | tee test-results/presentation-boundaries-detailed.log
          swift test --skip-build --filter WebAcceptanceIntegrationTests 2>&1 | tee test-results/web-composition-detailed.log
          swift test --skip-build --filter PassivePermissionResumeTests 2>&1 | tee test-results/passive-permission-resume-detailed.log
          swift test --skip-build --filter ChromeActiveTabDescriptorTests 2>&1 | tee test-results/chrome-active-descriptor-detailed.log
          swift test --skip-build --filter AcceptedSelectionQueueTests 2>&1 | tee test-results/accepted-selection-queue-detailed.log
          swift test --skip-build --filter SelectionAuthorityTests 2>&1 | tee test-results/selection-authority-detailed.log
          swift test --skip-build --filter SelectionSubmissionQueueTests 2>&1 | tee test-results/selection-submission-detailed.log
          swift test --skip-build --filter SystemScreenshotWebCandidateTests 2>&1 | tee test-results/system-candidate-input-detailed.log
          swift test --skip-build --filter SystemScreenshotCandidateAdmissionTests 2>&1 | tee test-results/system-candidate-admission-detailed.log
          swift test --skip-build --filter SystemScreenshotObservationJournalTests 2>&1 | tee test-results/system-candidate-observations-detailed.log
          swift test --skip-build --filter SystemScreenshotCandidateIntegrationTests 2>&1 | tee test-results/system-candidate-composition-detailed.log
          swift test --skip-build --filter SystemScreenshotFidelityTests 2>&1 | tee test-results/system-candidate-fidelity-detailed.log
      - name: Package native application
        run: |
          set -o pipefail
          bash scripts/build-macos.sh 2>&1 | tee test-results/build.log
      - name: Run packaged executable with synthetic data
        run: |
          set -o pipefail
          build/Riftlet.app/Contents/MacOS/Riftlet --self-check 2>&1 | tee test-results/self-check.log
          riftlet_check_dir="$(mktemp -d)"
          trap 'rm -rf "$riftlet_check_dir"' EXIT
          ditto build/Riftlet.app "$riftlet_check_dir/Riftlet.app"
          "$riftlet_check_dir/Riftlet.app/Contents/MacOS/Riftlet" --web-acceptance-self-check 2>&1 | tee test-results/web-acceptance-self-check.log
          "$riftlet_check_dir/Riftlet.app/Contents/MacOS/Riftlet" --first-use-self-check 2>&1 | tee test-results/first-use-self-check.log
          "$riftlet_check_dir/Riftlet.app/Contents/MacOS/Riftlet" --system-screenshot-candidate-self-check 2>&1 | tee test-results/system-screenshot-candidate-self-check.log
          ditto -c -k --sequesterRsrc --keepParent build/Riftlet.app build/Riftlet-macOS-development.zip
      - name: Validate and archive synthetic GUI acceptance helper
        run: |
          set -o pipefail
          riftlet_bin_dir="$(swift build -c release --show-bin-path)"
          "$riftlet_bin_dir/RiftletGUIAcceptance" --self-check 2>&1 | tee test-results/gui-helper-self-check.log
          cp "$riftlet_bin_dir/RiftletGUIAcceptance" build/RiftletGUIAcceptance
          ditto -c -k --keepParent build/RiftletGUIAcceptance build/Riftlet-GUI-Acceptance.zip
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-foundation-${{ github.sha }}
          path: |
            test-results/
            build/Riftlet-macOS-development.zip
            build/Riftlet-GUI-Acceptance.zip
          if-no-files-found: ignore
          retention-days: 14
