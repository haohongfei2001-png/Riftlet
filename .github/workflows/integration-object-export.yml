name: Exact integration object assembly
on:
  pull_request:
    paths:
      - '.github/workflows/integration-object-export.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 15 && github.event.pull_request.head.ref == 'codex/riftlet-real-mac-acceptance-internal-beta-thin-edge-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce semantic merge and publish immutable objects only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The checked payload contains only deterministic source transformations.
          # It validates every input, exact output tree and protected subsystem.
          # It POSTs Git blobs/trees only: no ref update, push, main merge or release.
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          payload = ''''''
          source = lzma.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(source).hexdigest() == '7332da55f0c0441925a84a5320d7f40fd4a4c1c8defa276655ba19ad3558020d'
          path = pathlib.Path('/tmp/riftlet-exact-assembler.py')
          path.write_bytes(source)
          subprocess.run(['python3', str(path)], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-product-object-assembly-${{ github.event.pull_request.head.sha }}
          path: integration-assembly/
          if-no-files-found: warn
          retention-days: 3
