name: Feedback isolated host wiring
on:
  push:
    branches: ['codex/feedback-v01-20261028']
    paths: ['.github/workflows/feedback-bootstrap.yml']
permissions:
  contents: write
jobs:
  wire:
    if: github.ref == 'refs/heads/codex/feedback-v01-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/feedback-v01-20261028
      - name: Apply fingerprint-guarded minimal host diff
        run: |
          test "$(git branch --show-current)" = 'codex/feedback-v01-20261028'
          python3 scripts/apply-feedback-v01.py
          git diff --check
          git add Package.swift Sources/RiftletApp/RiftletMain.swift
          if ! git diff --cached --quiet; then
            git -c user.name='Riftlet Feedback Implementation' -c user.email='feedback@riftlet.invalid' commit -m 'Wire isolated feedback menu and typed host observations without changing Core or screenshot admission'
            git push origin HEAD:refs/heads/codex/feedback-v01-20261028
          fi
