        for(const sample of (coalesced.length?coalesced:[event]))observePointer(opticalPoint(sample),event.buttons,Math.abs(now()-sample.timeStamp)<1000?sample.timeStamp:now());
        if(phase==='select')updateTarget(local(event),!desktop.contains(event.target)||Boolean(event.target.closest('.rf-toolbar,.rf-options,.rf-thumb,.rf-page')));
      });
      document.documentElement.addEventListener('pointerleave',leaveDesktop);
      document.addEventListener('pointerup',()=>{pointerDown=false;pressedEntry=false;requestOptics();});
      layer.addEventListener('pointerdown',event=>{
        if(phase!=='select'||event.button!==0)return;stopDemo();event.preventDefault();const p=local(event);point=p;
        if(menuOpen){closeMenu();gesture={owner:'dismiss',id:event.pointerId};layer.setPointerCapture(event.pointerId);return;}
        const win=mode==='window'?windowAt(p):null;
        gesture={owner:'target',id:event.pointerId,start:p,mode,windowId:win?win.dataset.window:null,rect:mode==='window'&&win?rectOf(win):null};
        layer.setPointerCapture(event.pointerId);if(mode==='region')placeTarget({x:p.x,y:p.y,w:1,h:1},'region');else updateTarget(p);
      });
      layer.addEventListener('pointerup',event=>{
        const active=gesture;gesture=null;if(layer.hasPointerCapture(event.pointerId))layer.releasePointerCapture(event.pointerId);
        if(!active||active.owner!=='target'||active.id!==event.pointerId||phase!=='select'||active.mode!==mode)return;
        const p=local(event);point=p;
        if(mode==='region'){const rect=regionRect(active.start,p);if(rect.w>=1&&rect.h>=1&&Math.hypot(rect.w,rect.h)>=3)requestCapture(rect);else{target.hidden=true;say('拖动框选一个区域，松开即可截图。');}return;}
        if(Math.hypot(p.x-active.start.x,p.y-active.start.y)>8)return;
        if(mode==='full'){requestCapture({x:0,y:0,w:desktop.clientWidth,h:desktop.clientHeight});return;}
        const win=windowAt(p);if(win&&win.dataset.window===active.windowId)requestCapture(active.rect,active.windowId);
      });
      layer.addEventListener('pointercancel',()=>{gesture=null;target.hidden=true;});
      editCanvas.addEventListener('pointerdown',event=>{if(phase!=='edit'||!editorImage||event.button!==0)return;editGesture={id:event.pointerId,start:editPoint(event)};editCanvas.setPointerCapture(event.pointerId);event.preventDefault();});
      editCanvas.addEventListener('pointermove',event=>{if(!editGesture||editGesture.id!==event.pointerId)return;draftMark=regionRect(editGesture.start,editPoint(event));drawEditor();});
      editCanvas.addEventListener('pointerup',event=>{if(!editGesture||editGesture.id!==event.pointerId)return;const mark=regionRect(editGesture.start,editPoint(event));editGesture=null;draftMark=null;if(mark.w>=4&&mark.h>=4)marks.push(mark);if(editCanvas.hasPointerCapture(event.pointerId))editCanvas.releasePointerCapture(event.pointerId);drawEditor();});
      editCanvas.addEventListener('pointercancel',()=>{editGesture=null;draftMark=null;drawEditor();});
      $('[data-undo]').addEventListener('click',()=>{marks.pop();drawEditor();});$('[data-original]').addEventListener('click',()=>finishEditor(true));$('[data-edit-done]').addEventListener('click',()=>finishEditor(false));
      document.addEventListener('keydown',event=>{
        if(event.key!=='Escape'||!root.isConnected)return;stopDemo();
        if(phase==='edit'){finishEditor(true);event.preventDefault();return;}
        if(menuOpen){closeMenu();event.preventDefault();return;}
        if(phase!=='rest'){cancelCapture();event.preventDefault();}
      });
      $('[data-page]').addEventListener('click',()=>{pageStart=pageStart===0?Math.max(0,assets.length-3):Math.max(0,pageStart-3);renderQueue();});
      $('[data-theme]').addEventListener('click',()=>{dark=!dark;setTheme();});
      $('[data-seed]').addEventListener('click',()=>{
        stopDemo();cancelCapture();if(assets.length){assets=[];pageStart=0;say('已清空，远离时入口完全隐去。');}
        else{const ids=['finder','notes',null];assets=ids.map(windowId=>{const r=windowId?rectOf($('[data-window="'+windowId+'"]')):{x:desktop.clientWidth*.25,y:173,w:desktop.clientWidth*.48,h:183};return{id:nextID++,mode:windowId?'window':'region',windowId,rect:r,image:snapshot(r,{windowId}),state:'ready'};});pageStart=0;say('已有 3 张；靠近上方入口仍可继续截图。');}
        render();
      });
      $('[data-demo]').addEventListener('click',()=>{
        stopDemo();if(phase!=='rest')cancelCapture();demoActive=true;const token=++demoEpoch,start=now(),a=anchor(),from={x:Math.max(15,a.x-780),y:Math.max(60,a.y-80)};demoPointer.hidden=false;previousPoint=null;
        if(reduced.matches){demoActive=false;demoPointer.hidden=true;observePointer(a);say('入口已就位，可直接截取'+names[defaultMode]+'。');return;}
        function frame(t){if(token!==demoEpoch)return;const k=clamp((t-start)/360),p={x:from.x+(a.x-from.x)*k,y:from.y+(a.y-from.y)*k};observePointer(p,0,t);demoPointer.style.left=p.x+'px';demoPointer.style.top=p.y+'px';if(k<1)demoFrame=requestAnimationFrame(frame);else{demoActive=false;demoPointer.hidden=true;say('快速靠近后可直接点击；背景继续平顺显现。');}}demoFrame=requestAnimationFrame(frame);
      });
      new ResizeObserver(()=>{if(phase==='select'){gesture=null;target.hidden=true;camera.hidden=true;}paintRail();renderQueue();}).observe(desktop);
      all('[data-tooltip]').forEach(element=>element.title=element.dataset.tooltip);
      setTheme();paintRail();render();
    })();
  </script>
</div>
