<svg xmlns="http://www.w3.org/2000/svg" width="728" height="608" viewBox="0 0 728 608" role="img"><title>设置 / 显示与动效页 · 磁力为合成选择</title><desc>Riftlet Quiet edge. All desktop, window and image content is synthetic design reconstruction. One exported pixel equals one model logical point; not native App screenshots or a physical macOS acceptance test.</desc><rect x="0" y="0" width="728" height="608" rx="0" fill="#E7EDE8" opacity="1"/><rect x="24" y="30" width="680" height="520" rx="12" fill="#071C10" opacity="0.045"/><g transform="translate(24 24)"><defs><clipPath id="v50"><rect x="0" y="0" width="680" height="520" rx="12" fill="white" opacity="1"/></clipPath></defs><g clip-path="url(#v50)"><rect x="0" y="0" width="680" height="520" rx="0" fill="#F7F9F8" opacity="1"/><rect x="0" y="0" width="680" height="44" rx="0" fill="#F7F9F8" opacity="1"/><path d="M0 44H680" fill="none" stroke="#DCE4DF" stroke-width="0.6" opacity="1"/><circle cx="20" cy="22" r="5" fill="#ED7167" opacity="1"/><circle cx="38" cy="22" r="5" fill="#E6BD56" opacity="1"/><circle cx="56" cy="22" r="5" fill="#6BBE7C" opacity="1"/><text x="340" y="27" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="500" fill="#65716B" text-anchor="middle" opacity="1">设置与运行状态</text><text x="664" y="27" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#65716B" text-anchor="end" opacity="1">Riftlet</text><rect x="0" y="44" width="156" height="476" rx="0" fill="#F5F8F5" opacity="1"/><path d="M156 44L156 520" fill="none" stroke="#DCE4DF" stroke-width="0.5" opacity="1"/><text x="20" y="80" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="16" font-weight="600" fill="#172521" text-anchor="start" opacity="1">Riftlet</text><text x="20" y="101" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">让截图停在手边</text><g transform="translate(20 132) scale(0.8)" fill="none" stroke="#65716B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h14M3 14h14M7 3v6M13 11v6"/></g><text x="45" y="145" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="400" fill="#172521" text-anchor="start" opacity="1">运行状态</text><g transform="translate(20 171) scale(0.8)" fill="none" stroke="#65716B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h4l2-2h4l2 2h2v11H3z"/><circle cx="10" cy="11" r="3"/></g><text x="45" y="184" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="400" fill="#172521" text-anchor="start" opacity="1">截图入口</text><rect x="9" y="200" width="138" height="36" rx="6" fill="#E1F2EA" opacity="1"/><g transform="translate(20 210) scale(0.8)" fill="none" stroke="#087F73" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v16M7 4h10v11H7z"/></g><text x="45" y="223" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="400" fill="#087F73" text-anchor="start" opacity="1">显示与动效</text><g transform="translate(20 249) scale(0.8)" fill="none" stroke="#65716B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 3 5v5c0 4 7 8 7 8s7-4 7-8V5z"/><path d="m7 10 2 2 4-5"/></g><text x="45" y="262" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="400" fill="#172521" text-anchor="start" opacity="1">隐私与存储</text><g transform="translate(20 288) scale(0.8)" fill="none" stroke="#65716B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8"/><path d="M10 9v6M10 5v1"/></g><text x="45" y="301" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="400" fill="#172521" text-anchor="start" opacity="1">关于与支持</text><circle cx="20" cy="497" r="2" fill="#087F73" opacity="1"/><text x="28" y="501" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">内部候选 · 设计模拟</text><text x="180" y="88" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="20" font-weight="500" fill="#172521" text-anchor="start" opacity="1">显示与动效</text><text x="180" y="116" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">动效只解释物体去哪里，不抢走注意力。</text><text x="180" y="153" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="13" font-weight="500" fill="#172521" text-anchor="start" opacity="1">截图入缝</text><rect x="180" y="166" width="233" height="102" rx="8" fill="#FFFFFF" opacity="1" stroke="#DCE4DF" stroke-width="1"/><path d="M240 181L240 215" fill="none" stroke="#65716B" stroke-width="0.5" opacity="0.6"/><rect x="216" y="189" width="24" height="21" rx="1" fill="#AECBB9" opacity="1"/><text x="194" y="237" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="500" fill="#172521" text-anchor="start" opacity="1">无</text><text x="194" y="257" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">直接出现在裂缝中</text><circle cx="398" cy="181" r="6" fill="none" stroke="#65716B" stroke-width="1"/><rect x="423" y="166" width="233" height="102" rx="8" fill="#FFFFFF" opacity="1" stroke="#087F73" stroke-width="1"/><path d="M483 181L483 215" fill="none" stroke="#65716B" stroke-width="0.5" opacity="0.6"/><rect x="444" y="189" width="24" height="21" rx="1" fill="#87BAA7" opacity="1"/><text x="437" y="237" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="500" fill="#172521" text-anchor="start" opacity="1">磁力吸引</text><text x="437" y="257" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">从源头收束，轻轻入缝</text><circle cx="641" cy="181" r="6" fill="none" stroke="#087F73" stroke-width="1"/><circle cx="641" cy="181" r="3" fill="#087F73" opacity="1"/><path d="M470 199H479" fill="none" stroke="#65716B" stroke-width="0.7" opacity="0.5"/><text x="181" y="289" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="11" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">仅影响截图来到裂缝的过程。上传开始后的快速吞噬独立保留。</text><rect x="180" y="306" width="476" height="196" rx="8" fill="#FFFFFF" opacity="1" stroke="#DCE4DF" stroke-width="0.8"/><text x="193" y="326" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#172521" text-anchor="start" opacity="1">外观</text><text x="193" y="345" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="11" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">与桌面和窗口保持一致。</text><rect x="550" y="316" width="92" height="28" rx="6" fill="#FFFFFF" opacity="1" stroke="#DCE4DF" stroke-width="1"/><text x="596" y="334" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="500" fill="#172521" text-anchor="middle" opacity="1">浅色</text><g transform="translate(623.5 325.5) scale(0.375)"><path d="M6 9l6 6l6-6" fill="none" stroke="#65716B" stroke-width="3.73333" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M193 355H643" fill="none" stroke="#DCE4DF" stroke-width="0.5" opacity="1"/><text x="193" y="375" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#172521" text-anchor="start" opacity="1">减少动态效果</text><text x="193" y="394" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="11" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">取消空间位移，以短淡变表达状态。</text><rect x="612" y="371" width="30" height="18" rx="9" fill="#DCE4DF" opacity="1"/><circle cx="621" cy="380" r="7" fill="#FFFFFF" opacity="1"/><path d="M193 404H643" fill="none" stroke="#DCE4DF" stroke-width="0.5" opacity="1"/><text x="193" y="424" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#172521" text-anchor="start" opacity="1">减少透明度</text><text x="193" y="443" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="11" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">使用清晰、不透明的表面。</text><rect x="612" y="420" width="30" height="18" rx="9" fill="#DCE4DF" opacity="1"/><circle cx="621" cy="429" r="7" fill="#FFFFFF" opacity="1"/><path d="M193 453H643" fill="none" stroke="#DCE4DF" stroke-width="0.5" opacity="1"/><text x="193" y="473" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#172521" text-anchor="start" opacity="1">提高对比度</text><text x="193" y="492" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="11" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">强化边界与文字。</text><rect x="612" y="469" width="30" height="18" rx="9" fill="#DCE4DF" opacity="1"/><circle cx="621" cy="478" r="7" fill="#FFFFFF" opacity="1"/></g><rect x="0" y="0" width="680" height="520" rx="12" fill="none" opacity="1" stroke="#DCE4DF" stroke-width="0.8"/></g><text x="24" y="576" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="11" font-weight="500" fill="#172521" text-anchor="start" opacity="1">设置 / 显示与动效页 · 磁力为合成选择</text><text x="24" y="594" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">设计重构 · 非 App 截图 · 窗口 680 × 520 pt · 100% 逻辑尺寸</text></svg>