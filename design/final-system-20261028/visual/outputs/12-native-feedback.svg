<svg xmlns="http://www.w3.org/2000/svg" width="648" height="628" viewBox="0 0 648 628" role="img"><title>Feedback v0.1 / 编辑页 · 本机记录折叠</title><desc>Riftlet Quiet edge. All desktop, window and image content is synthetic design reconstruction. One exported pixel equals one model logical point; not native App screenshots or a physical macOS acceptance test.</desc><rect x="0" y="0" width="648" height="628" rx="0" fill="#E7EDE8" opacity="1"/><rect x="24" y="30" width="600" height="540" rx="12" fill="#071C10" opacity="0.045"/><g transform="translate(24 24)"><defs><clipPath id="v52"><rect x="0" y="0" width="600" height="540" rx="12" fill="white" opacity="1"/></clipPath></defs><g clip-path="url(#v52)"><rect x="0" y="0" width="600" height="540" rx="0" fill="#F7F9F8" opacity="1"/><rect x="0" y="0" width="600" height="44" rx="0" fill="#F7F9F8" opacity="1"/><path d="M0 44H600" fill="none" stroke="#DCE4DF" stroke-width="0.6" opacity="1"/><circle cx="20" cy="22" r="5" fill="#ED7167" opacity="1"/><circle cx="38" cy="22" r="5" fill="#E6BD56" opacity="1"/><circle cx="56" cy="22" r="5" fill="#6BBE7C" opacity="1"/><text x="300" y="27" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="500" fill="#65716B" text-anchor="middle" opacity="1">反馈与建议</text><text x="584" y="27" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#65716B" text-anchor="end" opacity="1">Riftlet</text><text x="24" y="88" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="20" font-weight="500" fill="#172521" text-anchor="start" opacity="1">哪里不顺手？</text><text x="24" y="115" font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="12" font-weight="400" fill="#65716B" text-anchor="start" opacity="1">也欢迎告诉我们，你希望它变得怎样。</text><rect x="464" y="68" width="112" height="24" rx="5" fill="#F7F9F8" opacity="1" stroke="#DCE4DF" stroke-width="0.7"/><g transform="translate(470 74) scale(0.6)" fill="none" stroke="#65716B" st