 function header(){return `<header class="viewer-header"><div class="viewer-brand"><span class="brand-mark">${logo()}</span><div><div class="brand-name">Riftlet</div><div class="brand-sub">产品体验设计 · 2026.11</div></div></div><div class="viewer-top-actions"><span class="version-note">基于个人 Beta 2 · 独立设计方案</span><button class="icon-btn" data-action="theme" aria-label="切换深浅色">${I(state.theme==='dark'?'sun':'moon',18)}</button><button class="icon-btn" data-action="fullscreen" aria-label="全屏查看原型">${I('expand',17)}</button></div></header><nav class="scene-nav" aria-label="设计界面" role="tablist">${Object.entries(scenes).map(([k,v])=>`<button data-scene="${k}" role="tab" aria-selected="${state.scene===k}">${v[0]}</button>`).join('')}</nav><div class="scene-meta"><h1>${scenes[state.scene][1]}</h1><p>${state.scene==='desktop'?'微图 72 × 56 pt · 3 张 · 左中':state.scene==='control'?'304 pt 宽 · 常态紧凑 · 异常原位恢复':state.scene==='settings'?'780 × 584 pt · 六页完整设置':state.scene==='history'?'828 × 582 pt · 合成示例':state.scene==='onboarding'?'620 × 516 pt · 三步开始':state.scene==='compare'?'截图内容不含真实用户资料':'暖白 / 石墨 / 青绿'}</p></div>`}

 function chat(){return `<section class="native-window chat-window" aria-label="合成聊天工作区"><div class="titlebar">${traffic()}<span>设计笔记</span><div class="bar-spacer"></div><span class="window-caption">ChatGPT · 示例工作区</span>${I('more',17)}</div><div class="chat-layout"><aside class="chat-side"><div style="display:flex;align-items:center;gap:7px;padding:0 8px">${I('plus',14)} 新聊天</div><div class="tiny-heading">项目</div><div class="chat-topic active">产品设计</div><div class="chat-topic">阅读与思考</div><div class="tiny-heading">最近</div><div class="chat-topic">整理界面参考</div><div class="chat-topic">记录一个新想法</div></aside><div class="chat-content"><div class="chat-label">产品设计 / 设计笔记</div><h2>把注意力，<br>留给正在做的事。</h2><p>好的工具，在需要时自然出现。<br>当一张截图已经表达清楚，就让它接着说下去。</p><div class="chat-rule"></div><div class="chat-note">${I('image',17)}<span>可以附加界面、笔记或实现片段，一起讨论。</span></div><div class="composer"><div class="attached-list" id="attached-list"></div><textarea class="composer-input" aria-label="示例聊天正文，不会发送">${esc(state.draft)}</textarea><div class="composer-tools">${I('plus',16)}<span>工具</span><div class="bar-spacer"></div><button class="send-mock" data-action="never-send" aria-label="演示不发送消息">${I('arrow',15)}</button></div></div><div class="chat-bottom">示例聊天 · 原型内不会发送消息或连接外部服务</div></div></div></section><div class="background-note">A little less interruption.<br>A little more room.</div>`}

 function popover(){if(!state.popover)return '';const s=state.settings,warning=state.scenario==='save-error'||state.scenario==='permission';const status=warning?'需要处理':s.paused?'已暂停':s.hidden?'已隐藏':'正在收录';return `<section class="control-popover" aria-label="Riftlet 控制中心"><div class="popover-header"><span class="popover-name">Riftlet</span><div class="bar-spacer"></div><span class="status-inline"><b></b>${status}</span><button class="icon-btn" data-action="settings" aria-label="打开设置">${I('settings',15)}</button></div>${warning?`<div class="popover-error" role="status">${state.scenario==='permission'?'需要允许 Chrome 自动化访问。':'这次设置尚未保存。'}<br><button data-action="recover">${state.scenario==='permission'?'查看连接设置':'重试保存'}</button></div>`:''}<button class="btn popover-primary" data-action="capture" ${s.hidden||!s.entryEnabled?'disabled':''}>${I('camera',16)} 截图…</button>${s.hidden?'<div class="popover-subnote">显示裂缝后，可使用内置截图。</div>':''}<div class="popover-row">${I('image')}<span>收录新截图</span><div class="bar-spacer"></div>${switcher('collection','收录新截图',!s.paused)}</div><div class="popover-row">${I('eye')}<span>显示边缘微图</span><div class="bar-spacer"></div>${switcher('visibility','显示边缘微图',!s.hidden)}</div>${s.paused||s.hidden?`<div class="popover-subnote">${s.hidden&&!s.paused?'隐藏期间仍会收录，已有图片保留。':s.paused?'已有截图仍可使用。':''}</div>`:''}<div class="popover-rule"></div><button class="popover-command" data-action="history">${I('history')}<span>截图历史</span><div class="bar-spacer"></div>${I('chevron-right',13)}</button><button class="popover-command" data-action="latest" ${!state.queue.length?'disabled':''}>${I('image')}<span>定位最新截图</span></button><button class="popover-command" data-action="clear" ${!state.queue.length?'disabled':''}>${I('archive')}<span>从边缘收起全部</span></button><div class="popover-footer"><button data-action="feedback">反馈与建议</button><button data-action="more" aria-label="更多操作">${I('more',16)}</button></div>${state.popoverMore?`<div class="popover-rule"></div><button class="popover-command" data-action="onboarding">${I('help')}使用引导</button><button class="popover-command" data-action="quit">退出 Riftlet</button>`:''}</section>`}
 function settings(){return `<section class="native-window settings-window" aria-label="Riftlet 设置"><aside class="settings-sidebar">${traffic(true)}<div class="sidebar-label">Riftlet 设置</div><nav class="settings-nav" aria-label="设置页面">${Object.entries(window.RiftSettings?.pageNames||{}).map(([p,n])=>`<button data-setting-page="${p}" class="${state.page===p?'active':''}" aria-current="${state.page===p?'page':'false'}">${I(({general:'settings',display:'display',capture:'camera',motion:'motion',history:'history',help:'help'})[p])}<span>${n[0]}</span></button>`).join('')}</nav><div class="settings-sidebar-footer">Riftlet<br><span>个人 Beta 2 · 0.2.0 (2)</span></div></aside><main class="settings-content" id="settings-content">${window.RiftSettings?.render(state.page,state)||''}</main></section>`}
 const statuses={waiting:'在边缘',started:'已开始附加',unknown:'结果待核实',archived:'已归档',removed:'已收起',failed:'未能附加'};
 function historyMatches(s){const f=state.historyFilter;return (f==='all'||f==='review'&&s.status==='unknown'||f===s.status||f==='removed'&&s.visibility==='removed'||f==='collected'&&['archived','removed'].includes(s.status))&&(!state.historyQuery||(s.name+' '+s.time+' '+s.date).includes(state.historyQuery))}
 function history(){const style=state.settings.historyDisplayStyle||'current';const visible=state.history.filter(historyMatches);let selected=visible.find(s=>s.id===state.selectedHistory)||visible[0]||null;if(selected)state.selectedHistory=selected.id;const groups=['今天','昨天','更早'].map(day=>{const group=visible.filter(s=>day==='更早'?!['今天','昨天'].includes(s.date):s.date===day);return group.length?`<h3 class="history-group-title">${day}</h3><div class="history-grid">${group.map(s=>`<button class="history-item ${s.id===selected?.id?'selected':''}" data-history-id="${s.id}" aria-label="${s.name}，${s.time}，${statuses[s.status]}"><div class="history-image"><img alt="${s.name}合成截图" src="${s.src}"></div><div class="history-item-caption"><strong>${s.name}</strong><span>${s.time}</span><span>${s.status==='unknown'?I('info',12):s.status==='started'?I('check',12):['archived','removed'].includes(s.status)?I('archive',12):''}</span></div></button>`).join('')}</div>`:''}).join('');const canRestore=selected&&(['archived','removed'].includes(selected.status)||selected.visibility==='removed'&&selected.status==='failed');const details=selected?`<div class="history-detail-preview"><img src="${selected.src}" alt="${selected.name}预览"></div><h3>${selected.name}</h3><dl><dt>时间</dt><dd>${selected.date} ${selected.time}</dd><dt>大小</dt><dd>${selected.dimensions}</dd><dt>状态</dt><dd>${statuses[selected.status]}</dd></dl><p class="history-state-note">${selected.status==='unknown'?'是否附加完成仍不确定。请先查看原聊天；不会自动再次附加。':selected.status==='started'?'已从边缘收起。请在聊天中查看附件的实际状态。':canRestore?'可以放回边缘，需要时再点一下。':'图片保留在边缘，随时可以使用。'}</p><button class="btn" data-action="original" data-id="${selected.id}">${I('image',14)} 查看原图</button>${canRestore?`<button class="btn btn-quiet" data-action="restore" data-id="${selected.id}" style="margin-top:-7px">放回边缘</button>`:''}`:'<div class="history-empty">没有符合当前筛选的截图。</div>';return `<section class="native-window history-window" aria-label="截图历史"><div class="titlebar">${traffic(true)}<  function onboarding(){const step=state.step;let content='';if(step===0)content=`<h2>从截图到输入。<br>点一下就够了。</h2><p>熟悉的截图方式，多一点顺手。</p><div class="onboard-illustration"><div class="intro-shot"><img src="${samples[0].src}" alt="合成截图"></div><div class="intro-path"></div><div class="intro-edge"></div><div class="intro-mini"><img src="${samples[0].src}" alt="边缘微图"></div><div class="intro-path second"></div><div class="intro-composer"><img src="${samples[0].src}" alt="草稿中的附件"></div><button class="icon-btn intro-replay" data-action="intro-replay" aria-label="播放截图到附件演示">${I('play',14)}</button></div><div class="onboard-steps"><div><b>照常截图</b>继续使用 macOS 截图</div><div><b>点一下微图</b>截图出现在边缘</div><div><b>留在当前草稿</b>由你决定何时发送</div></div>`;

 if(step===2)content=`<h2>放在最顺手的地方。</h2><p>默认在左侧中部。以后随时可以调整。</p>${placementBoard()}<div class="placement-label"><span>显示器</span><select id="onboard-display" aria-label="引导中的显示器"><option value="main">主显示器</option><option value="external">外接显示器 · 演示</option></select><span>默认三张微图</span></div>`;
 if(step===3)content=`<div class="onboard-done"><div class="done-glyph">${logo(49)}</div><h2>${(state.settings.automationPermission==='granted')?'准备好了。':'先从收录截图开始。'}</h2><p>${(state.settings.automationPermission==='granted')?'照常截一张图。<br>在边缘点一下，继续你的工作。':'截图会留在边缘。连接 Chrome 后，<br>就可以点一下微图附加到当前聊天。'}</p><button class="btn btn-quiet" data-action="intro-demo">${I('play',14)} 看一次完整演示</button></div>`;
