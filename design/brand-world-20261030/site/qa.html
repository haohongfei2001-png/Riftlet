<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Riftlet — responsive review</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe4dc;color:#153d34;font:13px system-ui}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 24px;background:#f6f4ed;border-bottom:1px solid #b6c9bc}a{color:inherit}select,button{font:inherit;padding:6px 10px;border:1px solid #a8c0b0;background:transparent;border-radius:4px;color:inherit}main{padding:25px 0;overflow:auto}iframe{display:block;margin:auto;height:900px;border:1px solid #9eafa2;background:#f4f1e8;box-shadow:0 10px 35px #1b45301a}label{display:flex;gap:7px;align-items:center}</style></head><body><header><a href="review.html">← Brand review</a><label>Viewport <select id="width"><option>390</option><option>375</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Language <select id="locale"><option value="en">English</option><option value="zh">中文</option></select></label><label><input id="reduced" type="checkbox"> Reduced motion</label><span>True iframe layout width · no device or performance emulation</span></header><main><iframe id="viewport" title="Responsive Riftlet website" src="index.html" width="390" height="900"></iframe></main><script>'use strict';const width=document.getElementById('width'),locale=document.getElementById('locale'),reduced=document.getElementById('reduced'),frame=document.getElementById('viewport'),params=new URLSearchParams(location.search);if(['390','375','768','1024','1440'].includes(params.get('width')))width.value=params.get('width');if(params.get('locale')==='zh')locale.value='zh';reduced.checked=params.get('motion')==='reduced';function update(){frame.style.width=width.value+'px';frame.src=(locale.value==='zh'?'zh/index.html':'index.html')+(reduced.checked?'?motion=reduced':'');}width.addEvent
