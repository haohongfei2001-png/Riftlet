<!doctype html><meta charset="utf-8"><title>Riftlet local tab lifecycle fixture</title>
<form data-riftlet-draft="test"><textarea>local QA draft</textarea><label for="owned">Attach</label><input type="file" id="owned"><span id="prior"><img alt="previous QA attachment"></span></form>
<script>
const editor = document.querySelector('textarea'), field = document.querySelector('input');
const card = document.querySelector('#prior'), image = card.querySelector('img');
const text = editor.value, bytes = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='), ch=>ch.charCodeAt(0));
const previous = new File([bytes], 'previous.png', {type:'image/png'}), previousURL = URL.createObjectURL(previous);
image.src = previousURL;
editor.focus(); editor.setSelectionRange(2,8,'forward');
const counters = {input:0, change:0, send:0};
field.addEventListener('input',()=>counters.input++);
field.addEventListener('change',()=>counters.change++);
editor.form.addEventListener('submit',e=>{e.preventDefault();counters.send++});
const sha = async file => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer())),byte=>byte.toString(16).padStart(2,'0')).join('');
window.qa = {async snapshot(){
  await image.decode();
  return {...counters, visibility:document.visibilityState, text:editor.value===text,
    selection:editor.selectionStart===2 && editor.selectionEnd===8 && editor.selectionDirection==='forward',
    previous:card.parentNode===editor.form && card.firstElementChild===image &&
      image.currentSrc===previousURL && image.naturalWidth===1 && image.naturalHeight===1,
    previousSHA:await sha(previous), receivedSHA:field.files.length===1 ? await sha(field.files[0]) : null};
}};
</script>
